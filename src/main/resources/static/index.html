<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edu_mvp — Online Courses</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <h1><i class="fas fa-graduation-cap"></i> edu_mvp</h1>
      <nav>
        <a href="#" class="active" onclick="showPage('catalog')"><i class="fas fa-book"></i> Courses</a>
        <a href="#" onclick="showPage('students')"><i class="fas fa-users"></i> Students</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="page-catalog" class="page active">
      <div class="page-header">
        <h2>Course Catalog</h2>
        <button class="btn btn-sm" onclick="showAddCourseForm()"><i class="fas fa-plus"></i> Add Course</button>
      </div>
      <div id="course-list" class="course-grid"></div>
    </div>

    <div id="page-detail" class="page">
      <button class="btn btn-sm btn-back" onclick="showPage('catalog')"><i class="fas fa-arrow-left"></i> Back</button>
      <div id="course-detail"></div>
    </div>

    <div id="page-students" class="page">
      <div class="page-header">
        <h2>Students</h2>
        <button class="btn btn-sm" onclick="showAddStudentForm()"><i class="fas fa-plus"></i> Add Student</button>
      </div>
      <div id="student-list"></div>
    </div>

    <div id="page-enroll" class="page">
      <button class="btn btn-sm btn-back" onclick="showPage('catalog')"><i class="fas fa-arrow-left"></i> Back</button>
      <div id="enroll-form"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
